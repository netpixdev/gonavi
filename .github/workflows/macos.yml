name: macOS build and media test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gonavi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Core tests
        run: swift test --parallel
      - name: Cache speech engine
        uses: actions/cache@v4
        with:
          path: .build/whisper
          key: whisper-${{ matrix.arch }}-${{ hashFiles('scripts/build-whisper.sh') }}-xcode16.4
      - name: Package and verify ad-hoc signature
        run: bash scripts/build-app.sh
      - name: Actual video export smoke test
        run: dist/Gonavi.app/Contents/MacOS/Gonavi --smoke-test dist/smoke
      - name: Real automatic caption test
        run: bash scripts/test-captions.sh
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Gonavi-macOS-${{ matrix.arch }}
          path: |
            dist/Gonavi-macOS-${{ matrix.arch }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload media verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gonavi-media-test-${{ matrix.arch }}
          path: dist/smoke/
          if-no-files-found: ignore
          retention-days: 7
